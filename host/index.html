<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linko</title>
    <script>location.replace('http://localhost:3000');</script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a2e;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #16213e;
            padding: 30px;
            border-radius: 10px;
            width: 400px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        h1 {
            color: #0f4c75;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #0f4c75;
            color: white;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0f4c75;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #1e8bc3;
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }
        .status.connected {
            background: #2ecc71;
            color: white;
        }
        .status.disconnected {
            background: #e74c3c;
            color: white;
        }
        .status.connecting {
            background: #f39c12;
            color: white;
        }
        .video-preview {
            margin-top: 20px;
            width: 100%;
            max-height: 300px;
            background: #000;
            border-radius: 5px;
            overflow: hidden;
        }
        .video-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .controls button {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ScreenShare Host</h1>
        <div class="form-group">
            <label for="roomId">Room ID:</label>
            <input type="text" id="roomId" placeholder="Enter room ID">
        </div>
        <div class="form-group">
            <label for="userId">Your Name:</label>
            <input type="text" id="userId" placeholder="Enter your name">
        </div>
        <button id="startBtn">Start Sharing</button>
        <div id="status" class="status disconnected">Disconnected</div>
        <div class="video-preview">
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
        <div class="controls">
            <button id="stopBtn" disabled>Stop Sharing</button>
            <button id="inputBtn" disabled>Toggle Input Control</button>
        </div>
    </div>

    <script type="module" src="./src/renderer.js"></script>
</body>
</html>
